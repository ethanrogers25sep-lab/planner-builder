<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planner Builder</title><style>
:root{--accent:#8b7bb8;--ink:#403947;--muted:#756d79;--bg:#eeeaf0;--paper:#fff9f4}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{padding:18px 28px;background:rgba(255,255,255,.92);border-bottom:1px solid #ddd5df;display:flex;justify-content:space-between;align-items:center;gap:15px;position:sticky;top:0;z-index:5}h1{margin:0;font-size:24px}.tag{color:var(--muted);font-size:13px}.topbtn{border:0;border-radius:12px;padding:11px 16px;background:#403947;color:white;font-weight:750;cursor:pointer;box-shadow:0 4px 12px #0002}.app{display:grid;grid-template-columns:285px 1fr;min-height:calc(100vh - 70px)}aside{background:#fff;padding:20px;border-right:1px solid #ddd5df}.group{margin-bottom:20px}label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;margin:0 0 7px;color:#655c68}input,select{width:100%;padding:11px;border:1px solid #d8d0d9;border-radius:11px;background:#faf9fb;color:var(--ink);outline:none}input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #8b7bb822}.colors{display:flex;gap:9px;flex-wrap:wrap}.colors button{width:31px;height:31px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #ccc;cursor:pointer}.actions{display:grid;gap:9px}.actions button{padding:12px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer;transition:.15s}.actions button:hover,.topbtn:hover{transform:translateY(-1px);filter:brightness(.97)}.actions button.secondary{background:#f0edf2;color:#49414d}.workspace{padding:28px;display:flex;justify-content:center;align-items:flex-start;overflow:auto}.paper{background:var(--paper);width:min(720px,100%);min-height:1018px;padding:46px 44px;box-shadow:0 12px 35px #0002;border-radius:8px;position:relative;overflow:hidden}.paper:before{content:'✦  ✿  ✦';position:absolute;right:34px;top:22px;color:#a88fa4;font-size:17px;letter-spacing:6px}.paper h2{text-align:center;font-size:30px;margin:0 0 6px}.subtitle{text-align:center;color:var(--muted);margin-bottom:24px}.week-header{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px}.week-header .label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#776b76;font-weight:800}.doodle{font-size:20px;opacity:.7}.week{display:grid;grid-template-columns:1fr 1fr;gap:12px}.weekdaycard{position:relative;border:1px solid #d7cbd2;border-radius:12px;padding:14px 15px 12px 19px;background:var(--daybg);overflow:hidden;min-height:155px}.weekdaycard:before{content:'';position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--day)}.weekdaycard h3{margin:0 0 8px;color:var(--day);font-size:15px}.weekdaycard textarea{width:100%;height:103px;min-height:103px;border:0;outline:0;padding:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,#cfc4cc 26px);line-height:26px;resize:none;color:#49414d}.weekdaycard:after{content:'✧';position:absolute;right:12px;top:9px;color:var(--day);font-size:17px;opacity:.6}.weekdaycard:nth-child(1){--day:#9c6d88;--daybg:#fae9ef}.weekdaycard:nth-child(2){--day:#667ba8;--daybg:#e9eef9}.weekdaycard:nth-child(3){--day:#6f906d;--daybg:#eaf3e7}.weekdaycard:nth-child(4){--day:#ae8350;--daybg:#fbf0df}.weekdaycard:nth-child(5){--day:#7968a0;--daybg:#eee9f7}.friday{grid-column:1 / -1;min-height:210px}.friday textarea{height:151px;min-height:151px}.friday .mini-cols{display:flex;gap:8px;margin-top:8px}.friday .mini-cols span{font-size:10px;color:#7c707a;background:#fff8;border-radius:6px;padding:3px 7px}.week-footer{margin-top:15px;padding:10px 15px;border-radius:12px;background:#f2e9ef;text-align:center;font-size:11px;color:#786b75}.notebook{background:#f5eaf1;background-image:radial-gradient(#d4b9cb 1px,transparent 1px);background-size:18px 18px}.notes-page{background:#fff8fc;border:1px solid #e0cedb;border-radius:18px;padding:22px;box-shadow:inset 0 0 35px #d9b8cf33}.notes-grid{display:grid;grid-template-columns:1fr 2fr;grid-template-rows:minmax(300px,1fr) 180px;gap:0;border:2px solid #9d8297;border-radius:12px;overflow:hidden;background:#fff9fc}.notes-cell{padding:18px;position:relative}.notes-cell:first-child{border-right:2px solid #9d8297}.notes-cell.summary{grid-column:1/-1;border-top:2px solid #9d8297}.notes-cell h3{margin:0 0 12px;font-size:14px;color:#725b70;letter-spacing:1px;text-transform:uppercase}.notes-cell textarea{height:calc(100% - 30px);min-height:90px;border:0;outline:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 28px,#dfd0da 29px);line-height:29px;resize:none}.notes-cute{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.notes-cute span{font-size:22px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid #bbb}.weekday{padding:9px;text-align:center;font-weight:800;background:#f5f5f7;border-right:1px solid #ccc;border-bottom:1px solid #ccc;font-size:12px}.day{min-height:105px;padding:8px;border-right:1px solid #ddd;border-bottom:1px solid #ddd}.day b{display:block;margin-bottom:8px}.day textarea{border:0;padding:0;min-height:65px;background:transparent;font-size:12px;width:100%}@media(max-width:800px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #ddd}.paper{padding:28px 22px}.week{grid-template-columns:1fr}.friday{grid-column:auto}.notes-grid{grid-template-columns:1fr;grid-template-rows:auto auto 180px}.notes-cell:first-child{border-right:0;border-bottom:2px solid #9d8297}.notes-cell.summary{grid-column:auto}}
@media print{@page{size:A4 portrait;margin:0}body{background:white}.no-print,header,aside{display:none!important}.app{display:block}.workspace{padding:0}.paper{box-shadow:none;width:100%;min-height:auto;padding:12mm;border-radius:0}.paper h2{font-size:25px}.week,.notes-grid{break-inside:avoid}}
</style></head><body><header><div><h1>Planner Builder</h1><div class="tag">Create something that feels like yours ♡</div></div><button class="topbtn no-print" onclick="window.print()">🖨 Print / PDF</button></header><div class="app"><aside class="no-print"><div class="group"><label>Planner type</label><select id="type"><option value="month">Monthly Calendar</option><option value="week">Weekly Planner</option><option value="notes">Cute Notes — 3 Part</option></select></div><div class="group"><label>Title</label><input id="title" value="My Planner"></div><div class="group"><label>Subtitle</label><input id="subtitle" value="Plan your days, your way"></div><div class="group"><label>Page theme</label><div class="colors"><button style="background:#8b7bb8" data-c="#8b7bb8"></button><button style="background:#b98fa6" data-c="#b98fa6"></button><button style="background:#91a98d" data-c="#91a98d"></button><button style="background:#c7a16a" data-c="#c7a16a"></button><button style="background:#8d9fc4" data-c="#8d9fc4"></button><button style="background:#6f9e9b" data-c="#6f9e9b"></button></div></div><div class="group"><label>Paper</label><select id="size"><option>A4 Portrait</option><option>A5 Portrait</option><option>US Letter Portrait</option></select></div><div class="actions"><button onclick="downloadPlanner()">⬇ Download planner</button><button class="secondary" onclick="window.print()">🖨 Print planner</button><button class="secondary" onclick="resetPlanner()">↺ Reset design</button></div></aside><main class="workspace"><section class="paper" id="paper"></section></main></div><script>
const state={type:'month',title:'My Planner',subtitle:'Plan your days, your way',accent:'#8b7bb8',size:'A4 Portrait'};const $=id=>document.getElementById(id);function save(){localStorage.setItem('planner-builder',JSON.stringify(state))}function load(){try{Object.assign(state,JSON.parse(localStorage.getItem('planner-builder')||'{}'))}catch(e){}}function esc(s){return String(s).replace(/[&<>\\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}
function render(){document.documentElement.style.setProperty('--accent',state.accent);$('type').value=state.type;$('title').value=state.title;$('subtitle').value=state.subtitle;$('size').value=state.size;let p=$('paper');p.className='paper '+(state.type==='notes'?'notebook':'');p.innerHTML=`<h2>${esc(state.title)}</h2><div class="subtitle">${esc(state.subtitle)}</div>`;if(state.type==='month')renderMonth(p);if(state.type==='week')renderWeek(p);if(state.type==='notes')renderNotes(p)}
function renderMonth(p){let now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let names=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];let h='<div class="calendar">'+names.map(x=>`<div class="weekday">${x}</div>`).join('');for(let i=0;i<first;i++)h+='<div class="day"></div>';for(let d=1;d<=days;d++)h+=`<div class="day"><b>${d}</b><textarea placeholder="Tasks..."></textarea></div>`;p.innerHTML+=h+'</div>'}
function renderWeek(p){let names=['Monday','Tuesday','Wednesday','Thursday','Friday'];p.innerHTML+=`<div class="week-header"><span class="label">Five-day weekly overview</span><span class="doodle">☁︎ ✿ ✦</span></div><div class="week">${names.map((n,i)=>`<div class="weekdaycard ${n==='Friday'?'friday':''}"><h3>${n}</h3><textarea placeholder="Write tasks, appointments, priorities or notes..."></textarea>${n==='Friday'?'<div class="mini-cols"><span>✓ Wrap up</span><span>→ Weekend</span><span>♡ Wins</span></div>':''}</div>`).join('')}</div><div class="week-footer">♡ Small steps still count • Make space for what matters ♡</div>`}
function renderNotes(p){p.innerHTML+=`<div class="notes-cute"><strong>✿ Three-part study notes</strong><span>☁︎ ✦ ♡</span></div><div class="notes-page"><div class="notes-grid"><div class="notes-cell"><h3>Key points / cues</h3><textarea placeholder="Questions, keywords, cues..."></textarea></div><div class="notes-cell"><h3>Notes</h3><textarea placeholder="Write your main notes here..."></textarea></div><div class="notes-cell summary"><h3>Summary</h3><textarea placeholder="Summarize the page in a few lines..."></textarea></div></div></div>`}
function downloadPlanner(){let html='<!doctype html><html><head><meta charset="utf-8"><title>'+esc(state.title)+'</title><style>'+document.querySelector('style').textContent+'</style></head><body><section class="paper '+(state.type==='notes'?'notebook':'')+'">'+$('paper').innerHTML+'</section></body></html>';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=state.title.replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'-planner.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function resetPlanner(){localStorage.removeItem('planner-builder');Object.assign(state,{type:'month',title:'My Planner',subtitle:'Plan your days, your way',accent:'#8b7bb8',size:'A4 Portrait'});render()}
load();['type','title','subtitle','size'].forEach(id=>$(id).addEventListener('input',e=>{state[id]=e.target.value;save();render()}));document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{state.accent=b.dataset.c;save();render()});render();</script></body></html>
