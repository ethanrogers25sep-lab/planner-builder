<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planner Builder</title><style>
:root{--accent:#8b7bb8;--paper:#f6eef8;--ink:#403947;--muted:#756d79;--bg:#eeeaf0}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{padding:18px 28px;background:rgba(255,255,255,.94);border-bottom:1px solid #ddd5df;display:flex;justify-content:space-between;align-items:center;gap:15px;position:sticky;top:0;z-index:5}h1{margin:0;font-size:24px}.tag{color:var(--muted);font-size:13px}.topbtn{border:0;border-radius:12px;padding:11px 16px;background:#403947;color:white;font-weight:750;cursor:pointer;box-shadow:0 4px 12px #0002}.app{display:grid;grid-template-columns:285px 1fr;min-height:calc(100vh - 70px)}aside{background:#fff;padding:20px;border-right:1px solid #ddd5df}.group{margin-bottom:20px}label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;margin:0 0 7px;color:#655c68}input,select{width:100%;padding:11px;border:1px solid #d8d0d9;border-radius:11px;background:#faf9fb;color:var(--ink);outline:none}input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #8b7bb822}.colors{display:flex;gap:9px;flex-wrap:wrap}.colors button{width:31px;height:31px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #ccc;cursor:pointer}.actions{display:grid;gap:9px}.actions button{padding:12px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer;transition:.15s}.actions button:hover,.topbtn:hover{transform:translateY(-1px);filter:brightness(.97)}.actions button.secondary{background:#f0edf2;color:#49414d}.workspace{padding:28px;display:flex;justify-content:center;align-items:flex-start;overflow:auto}.paper{background:var(--paper);width:min(720px,100%);min-height:1018px;padding:38px 42px;transition:background .15s;box-shadow:0 12px 35px #0002;border-radius:8px;position:relative;overflow:hidden}.paper:before{content:'✦  ✿  ✦';position:absolute;right:34px;top:20px;color:#a88fa4;font-size:17px;letter-spacing:6px}.paper h2{text-align:center;font-size:29px;margin:0 0 5px}.subtitle{text-align:center;color:var(--muted);margin-bottom:19px}.week-header{display:flex;align-items:center;justify-content:space-between;margin:0 0 11px}.week-header .label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#776b76;font-weight:800}.doodle{font-size:20px;opacity:.7}.week{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr .78fr;gap:12px;flex:1;min-height:0}.weekdaycard{position:relative;border:1px solid #d7cbd2;border-radius:12px;padding:12px 14px 10px 18px;background:var(--daybg);overflow:hidden;min-height:0;height:100%}.weekdaycard:before{content:'';position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--day)}.weekdaycard h3{margin:0 0 7px;color:var(--day);font-size:15px}.weekdaycard textarea{width:100%;height:92px;min-height:92px;border:0;outline:0;padding:0;background:transparent;line-height:26px;resize:none;color:#49414d}.weekdaycard:after{content:'✧';position:absolute;right:12px;top:8px;color:var(--day);font-size:17px;opacity:.6}.weekdaycard:nth-child(1){--day:#9c6d88;--daybg:#fae9ef}.weekdaycard:nth-child(2){--day:#667ba8;--daybg:#e9eef9}.weekdaycard:nth-child(3){--day:#6f906d;--daybg:#eaf3e7}.weekdaycard:nth-child(4){--day:#ae8350;--daybg:#fbf0df}.weekdaycard:nth-child(5){--day:#7968a0;--daybg:#eee9f7}.friday{grid-column:1 / -1;min-height:0;height:100%}.friday textarea{height:94px;min-height:94px}.friday .mini-cols{display:flex;gap:8px;margin-top:6px}.friday .mini-cols span{font-size:10px;color:#7c707a;background:#fff8;border-radius:6px;padding:3px 7px}.paper:has(.week){height:297mm;min-height:297mm;padding:10mm}.paper:has(.week) h2{margin-bottom:4px}.paper:has(.week) .subtitle{margin-bottom:10px}.paper:has(.week) .week-header{margin-bottom:8px}.paper:has(.week) .week-footer{margin-top:8px}.paper:has(.week) .weekdaycard{padding:16px 18px 12px 22px}.paper:has(.week) .weekdaycard h3{font-size:17px}.paper:has(.week) .weekdaycard textarea{height:calc(100% - 30px);min-height:0}.week-footer{margin-top:10px;padding:8px 15px;border-radius:12px;background:#f2e9ef;text-align:center;font-size:11px;color:#786b75}.notebook{background:#f5eaf1;background-image:radial-gradient(#d4b9cb 1px,transparent 1px);background-size:18px 18px}.paper:has(.notes-page){height:297mm;min-height:297mm;padding:10mm}.paper:has(.notes-page) h2{margin-bottom:4px}.paper:has(.notes-page) .subtitle{display:none}.notes-page{height:calc(100% - 58px);background-color:#fffdf8;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,#dfe3e8 26px);border:1px solid #e0cedb;border-radius:18px;padding:18px;box-shadow:inset 0 0 35px #d9b8cf33}.notes-grid{display:grid;grid-template-columns:26% 74%;grid-template-rows:minmax(0,1fr) 125px;gap:0;border:0;border-radius:0;overflow:hidden;background:transparent;height:100%;position:relative}.notes-cell{padding:14px 16px;position:relative;background:transparent}.notes-cell:first-child{border-right:3px solid #4b4b4b}.notes-cell.summary{grid-column:1/-1;border-top:3px solid #4b4b4b;padding:12px 16px}.notes-cell h3{margin:0 0 10px;font-size:15px;color:#4d78bd;letter-spacing:.5px;text-transform:none;font-weight:850}.notes-cell textarea{width:100%;height:calc(100% - 28px);min-height:90px;border:0;outline:0;background:transparent;line-height:26px;resize:none;color:#393939}.notes-cute{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.notes-cute strong{font-size:18px}.notes-cute span{font-size:22px}.calendar-wrap{overflow:hidden}.calendar{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid #bbb;width:100%}.weekday{padding:8px 5px;text-align:center;font-weight:800;background:#f5f5f7;border-right:1px solid #ccc;border-bottom:1px solid #ccc;font-size:11px}.day{min-height:115px;padding:7px;border-right:1px solid #ddd;border-bottom:1px solid #ddd}.day b{display:block;margin-bottom:7px}.day textarea{border:0;padding:0;min-height:78px;background:transparent;font-size:12px;width:100%;resize:none;outline:0}.placeholder-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid #ddd5df;border-radius:11px;background:#faf9fb;font-size:12px}.switch{width:38px;height:22px;border-radius:20px;background:#c8c1ca;position:relative;border:0;cursor:pointer}.switch:after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.15s}.switch.on{background:var(--accent)}.switch.on:after{left:18px}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #ddd}.paper{padding:25px 18px}.paper:has(.week),.paper:has(.notes-page){height:auto;min-height:1018px}.week{grid-template-columns:1fr;grid-template-rows:none;flex:none}.weekdaycard{min-height:190px;height:auto}.friday{height:auto}.friday{grid-column:auto}.notes-grid{grid-template-columns:1fr;grid-template-rows:310px 430px 170px}.notes-cell:first-child{border-right:0;border-bottom:2px solid #9d8297}.notes-cell.summary{grid-column:auto}.calendar{min-width:650px}.calendar-wrap{overflow-x:auto}}
@media print{body{background:white}.no-print,header,aside{display:none!important}.app{display:block}.workspace{padding:0}.paper{box-shadow:none;width:210mm;height:277mm;min-height:277mm;max-height:277mm;padding:10mm;border-radius:0;overflow:hidden;break-after:page}.paper:has(.week),.paper:has(.notes-page){height:277mm;min-height:277mm;max-height:277mm}.notes-page{height:calc(100% - 58px)}.paper h2{font-size:25px}.week,.notes-grid{break-inside:avoid}.week{height:calc(100% - 105px)}.notes-grid{height:100%;grid-template-columns:26% 74%;grid-template-rows:minmax(0,1fr) 125px}.notes-cell:first-child{border-right:3px solid #4b4b4b}.notes-cell.summary{grid-column:1/-1;border-top:3px solid #4b4b4b}.calendar-print-page{width:100%;min-height:auto}.week{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr .78fr}.friday{grid-column:1/-1}.weekdaycard{break-inside:avoid}@page{size:A4 portrait;margin:10mm}}
</style></head><body><header><div><h1>Planner Builder</h1><div class="tag">Create something that feels like yours ♡</div></div><button class="topbtn no-print" onclick="printPlanner()">🖨 Print / Save PDF</button></header><div class="app"><aside class="no-print"><div class="group"><label>Planner type</label><select id="type"><option value="month">Monthly Calendar</option><option value="week">Weekly Planner</option><option value="notes">Cute Notes — 3 Part</option></select></div><div class="group"><label>Title</label><input id="title" value="My Planner"></div><div class="group"><label>Subtitle</label><input id="subtitle" value="Plan your days, your way"></div><div class="group"><label>Page theme</label><div class="colors"><button style="background:#8b7bb8" data-c="#8b7bb8"></button><button style="background:#b98fa6" data-c="#b98fa6"></button><button style="background:#91a98d" data-c="#91a98d"></button><button style="background:#c7a16a" data-c="#c7a16a"></button><button style="background:#8d9fc4" data-c="#8d9fc4"></button><button style="background:#6f9e9b" data-c="#6f9e9b"></button></div></div><div class="group"><label>Paper</label><select id="size"><option>A4 Portrait</option><option>A5 Portrait</option><option>US Letter Portrait</option></select></div><div class="group"><label>Placeholder text</label><div class="placeholder-toggle"><span>Show “Write your tasks here”</span><button id="placeholderSwitch" class="switch on" aria-label="Toggle placeholder text"></button></div></div><div class="actions"><button onclick="downloadPDF()">⬇ Download PDF</button><button class="secondary" onclick="printPlanner()">🖨 Print / Save PDF</button><button class="secondary" onclick="resetPlanner()">↺ Reset design</button></div></aside><main class="workspace"><section class="paper" id="paper"></section></main></div><script>
const state={type:'month',title:'My Planner',subtitle:'Plan your days, your way',accent:'#8b7bb8',size:'A4 Portrait',showPlaceholder:true};const $=id=>document.getElementById(id);function save(){localStorage.setItem('planner-builder',JSON.stringify(state))}function load(){try{Object.assign(state,JSON.parse(localStorage.getItem('planner-builder')||'{}'))}catch(e){}}function esc(s){return String(s).replace(/[&<>\\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}function ph(t){return state.showPlaceholder?t:''}
function render(){document.documentElement.style.setProperty('--accent',state.accent);const pageColors={'#8b7bb8':'#f1ebf8','#b98fa6':'#f8eaf0','#91a98d':'#edf5ea','#c7a16a':'#fbf2e3','#8d9fc4':'#edf1f9','#6f9e9b':'#e8f4f2'};document.documentElement.style.setProperty('--paper',pageColors[state.accent]||'#f6eef8');$('type').value=state.type;$('title').value=state.title;$('subtitle').value=state.subtitle;$('size').value=state.size;$('placeholderSwitch').classList.toggle('on',state.showPlaceholder);let p=$('paper');p.className='paper '+(state.type==='notes'?'notebook':'');p.innerHTML=`<h2>${esc(state.title)}</h2><div class="subtitle">${esc(state.subtitle)}</div>`;if(state.type==='month')renderMonth(p);if(state.type==='week')renderWeek(p);if(state.type==='notes')renderNotes(p)}
function renderMonth(p){let now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let names=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];let h='<div class="calendar-wrap calendar-print-page"><div class="calendar">'+names.map(x=>`<div class="weekday">${x}</div>`).join('');for(let i=0;i<first;i++)h+='<div class="day"></div>';for(let d=1;d<=days;d++)h+=`<div class="day"><b>${d}</b><textarea placeholder="${ph('Tasks...')}"></textarea></div>`;p.innerHTML+=h+'</div></div>'}
function renderWeek(p){let names=['Monday','Tuesday','Wednesday','Thursday','Friday'];p.innerHTML+=`<div class="week-header"><span class="label">Five-day weekly overview</span><span class="doodle">☁︎ ✿ ✦</span></div><div class="week">${names.map(n=>`<div class="weekdaycard ${n==='Friday'?'friday':''}"><h3>${n}</h3><textarea placeholder="${ph('Write your tasks here...')}"></textarea>${n==='Friday'?'<div class="mini-cols"><span>✓ Wrap up</span><span>→ Weekend</span><span>♡ Wins</span></div>':''}</div>`).join('')}</div><div class="week-footer">♡ Small steps still count • Make space for what matters ♡</div>`}
function renderNotes(p){p.innerHTML+=`<div class="notes-cute"><strong>Notes</strong><span>☁︎ ✦ ♡</span></div><div class="notes-page"><div class="notes-grid"><div class="notes-cell"><h3>Cues:</h3><textarea placeholder="${ph('Key words, questions, cues...')}"></textarea></div><div class="notes-cell"><h3>Note-Taking Area:</h3><textarea placeholder="${ph('Write your notes here...')}"></textarea></div><div class="notes-cell summary"><h3>Summary:</h3><textarea placeholder="${ph('Summarize the main ideas here...')}"></textarea></div></div></div>`}
function printPlanner(){let old=document.title;document.title=state.title+' - Planner';window.print();setTimeout(()=>document.title=old,500)}
function downloadPDF(){let old=document.title;document.title=state.title+' - Planner';window.print();setTimeout(()=>document.title=old,500)}
function resetPlanner(){localStorage.removeItem('planner-builder');Object.assign(state,{type:'month',title:'My Planner',subtitle:'Plan your days, your way',accent:'#8b7bb8',size:'A4 Portrait',showPlaceholder:true});render()}
load();['type','title','subtitle','size'].forEach(id=>$(id).addEventListener('input',e=>{state[id]=e.target.value;save();render()}));document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{state.accent=b.dataset.c;save();render()});$('placeholderSwitch').onclick=()=>{state.showPlaceholder=!state.showPlaceholder;save();render()};render();
</script></body></html>
