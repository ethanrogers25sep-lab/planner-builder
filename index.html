<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planner Builder</title>
<style>
:root{--accent:#6c63ff;--paper:#fff;--ink:#252533;--muted:#777;--bg:#f3f4f8}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{padding:22px 28px;background:#fff;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center;gap:15px;position:sticky;top:0;z-index:5}h1{margin:0;font-size:24px}header span{color:var(--muted);font-size:13px}.app{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 78px)}aside{background:#fff;padding:20px;border-right:1px solid #ddd}.group{margin-bottom:24px}label{display:block;font-size:13px;font-weight:700;margin:0 0 7px}select,input,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px;border:1px solid #d8d8e0;border-radius:9px;background:#fff}textarea{resize:vertical;min-height:90px}.colors{display:flex;gap:8px;flex-wrap:wrap}.colors button{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ccc;cursor:pointer}.actions{display:grid;gap:9px}.actions button{padding:11px;border:0;border-radius:9px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.actions button.secondary{background:#eee;color:#333}.workspace{padding:30px;display:flex;justify-content:center;align-items:flex-start;overflow:auto}.paper{background:var(--paper);width:min(900px,100%);min-height:900px;padding:42px;box-shadow:0 8px 30px #0001;border-radius:4px}.paper h2{text-align:center;font-size:30px;margin:0 0 8px}.subtitle{text-align:center;color:var(--muted);margin-bottom:25px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid #bbb}.weekday{padding:9px;text-align:center;font-weight:800;background:#f5f5f7;border-right:1px solid #ccc;border-bottom:1px solid #ccc;font-size:12px}.day{min-height:105px;padding:8px;border-right:1px solid #ddd;border-bottom:1px solid #ddd}.day b{display:block;margin-bottom:8px}.day textarea{border:0;padding:0;min-height:65px;background:transparent;font-size:12px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}.weekdaycard{border:1px solid #ddd;border-top:4px solid var(--accent);padding:10px;min-height:480px}.weekdaycard h3{margin:0 0 10px}.weekdaycard textarea{min-height:390px;border:0;padding:0}.notes{border:2px dashed #ccc;padding:20px;min-height:500px}.hidden{display:none}@media(max-width:800px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #ddd}.paper{padding:20px}.day{min-height:80px}.week{grid-template-columns:1fr 1fr}.weekdaycard{min-height:260px}.weekdaycard textarea{min-height:190px}}@media print{body{background:white}.no-print,header,aside{display:none!important}.app{display:block}.workspace{padding:0}.paper{box-shadow:none;width:100%;min-height:auto;padding:12mm;border-radius:0}.paper h2{font-size:25px}.day{break-inside:avoid}.week{break-inside:avoid}}
</style></head>
<body>
<header><div><h1>Planner Builder</h1><span>Create, customize, download and print your planner.</span></div><button class="no-print" onclick="window.print()">🖨️ Print / Save PDF</button></header>
<div class="app"><aside class="no-print">
<div class="group"><label>Planner type</label><select id="type"><option value="month">Monthly Calendar</option><option value="week">Weekly Planner</option><option value="notes">Notes Page</option></select></div>
<div class="group"><label>Title</label><input id="title" value="My Planner"></div>
<div class="group"><label>Subtitle</label><input id="subtitle" value="Plan your days, your way"></div>
<div class="group"><label>Accent color</label><div class="colors"><button style="background:#6c63ff" data-c="#6c63ff"></button><button style="background:#e85d75" data-c="#e85d75"></button><button style="background:#2a9d8f" data-c="#2a9d8f"></button><button style="background:#f4a261" data-c="#f4a261"></button><button style="background:#457b9d" data-c="#457b9d"></button><button style="background:#333" data-c="#333"></button></div></div>
<div class="group"><label>Page size</label><select id="size"><option>A4</option><option>A5</option><option>US Letter</option></select></div>
<div class="actions"><button onclick="downloadPlanner()">⬇️ Download planner</button><button class="secondary" onclick="window.print()">🖨️ Print planner</button><button class="secondary" onclick="resetPlanner()">↺ Reset</button></div>
</aside><main class="workspace"><section class="paper" id="paper"></section></main></div>
<script>
const state={type:'month',title:'My Planner',subtitle:'Plan your days, your way',accent:'#6c63ff',size:'A4'};
const $=id=>document.getElementById(id);function save(){localStorage.setItem('planner-builder',JSON.stringify(state))}function load(){try{Object.assign(state,JSON.parse(localStorage.getItem('planner-builder')||'{}'))}catch(e){}}
function render(){document.documentElement.style.setProperty('--accent',state.accent);$('type').value=state.type;$('title').value=state.title;$('subtitle').value=state.subtitle;$('size').value=state.size;let p=$('paper');p.innerHTML=`<h2>${esc(state.title)}</h2><div class="subtitle">${esc(state.subtitle)}</div>`;if(state.type==='month')renderMonth(p);if(state.type==='week')renderWeek(p);if(state.type==='notes')renderNotes(p)}
function renderMonth(p){let now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let names=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];let h='<div class="calendar">'+names.map(x=>`<div class="weekday">${x}</div>`).join('');for(let i=0;i<first;i++)h+='<div class="day"></div>';for(let d=1;d<=days;d++)h+=`<div class="day"><b>${d}</b><textarea placeholder="Tasks..."></textarea></div>`;p.innerHTML+=h+'</div>'}
function renderWeek(p){let names=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];p.innerHTML+=`<div class="week">${names.map(n=>`<div class="weekdaycard"><h3>${n}</h3><textarea placeholder="Tasks, appointments, priorities..."></textarea></div>`).join('')}</div>`}
function renderNotes(p){p.innerHTML+='<div class="notes"><textarea style="width:100%;height:450px;border:0;font-size:16px" placeholder="Write your notes here..."></textarea></div>'}
function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}
function downloadPlanner(){let html='<!doctype html><html><head><meta charset="utf-8"><title>'+esc(state.title)+'</title><style>'+document.querySelector('style').textContent+'</style></head><body><section class="paper">'+$('paper').innerHTML+'</section></body></html>';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=state.title.replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'-planner.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function resetPlanner(){localStorage.removeItem('planner-builder');Object.assign(state,{type:'month',title:'My Planner',subtitle:'Plan your days, your way',accent:'#6c63ff',size:'A4'});render()}
load();['type','title','subtitle','size'].forEach(id=>$(id).addEventListener('input',e=>{state[id]=e.target.value;save();render()}));document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{state.accent=b.dataset.c;save();render()});render();
</script></body></html>
